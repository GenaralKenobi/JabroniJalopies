name: iOS Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.genaralkenobi.maintenance

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write # to publish screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator found"; xcrun simctl list devices available; exit 1
          fi
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          mkdir -p build
          status=0
          xcodebuild test \
            -project VehicleMaintenance.xcodeproj \
            -scheme VehicleMaintenance \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1 || status=$?
          # Print only the useful lines; the full log is uploaded as an artifact.
          grep -E "error:|warning:|Test .*(passed|failed)|✔|✘|\*\* (BUILD|TEST)" build/xcodebuild.log | sort -u | head -300 || true
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild failed with exit code $status"
            tail -80 build/xcodebuild.log
          fi
          exit $status

      - name: Build Release for device (unsigned)
        run: |
          status=0
          xcodebuild build \
            -project VehicleMaintenance.xcodeproj \
            -scheme VehicleMaintenance \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedDataRelease \
            CODE_SIGNING_ALLOWED=NO \
            > build/release.log 2>&1 || status=$?
          grep -E "error:|warning:|\*\* BUILD" build/release.log | grep -v appintents | sort -u | head -100 || true
          if [ "$status" -ne 0 ]; then
            echo "::error::Release build failed with exit code $status"
            tail -80 build/release.log
          fi
          exit $status

      - name: Capture simulator screenshots
        if: success()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/VehicleMaintenance.app"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots
          for appearance in light dark; do
            xcrun simctl ui "$UDID" appearance "$appearance"
            for tab in garage upcoming settings; do
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" || true
              xcrun simctl launch "$UDID" "$BUNDLE_ID" -demoData YES -initialTab "$tab"
              sleep 6
              xcrun simctl io "$UDID" screenshot "screenshots/${tab}-${appearance}.png"
            done
          done

      - name: Publish screenshots to the ci-screenshots branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHOTS=$(mktemp -d)
          cp screenshots/*.png "$SHOTS"/
          cd "$SHOTS"
          {
            echo "# Simulator screenshots"
            echo
            echo "Built from ${GITHUB_SHA} (run ${GITHUB_RUN_ID})."
            echo
            for f in *.png; do echo "### ${f%.png}"; echo; echo "<img src=\"$f\" width=\"300\">"; echo; done
          } > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-results
          if-no-files-found: ignore
          path: |
            build/xcodebuild.log
            build/release.log
            build/TestResults.xcresult
            screenshots/
