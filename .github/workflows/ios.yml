name: iOS Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUNDLE_ID: com.genaralkenobi.maintenance

jobs:
  firebase-rules:
    name: Security rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Run rules tests against the emulators
        run: npm test

  build-and-test:
    name: Build, unit tests and screenshots
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write # to publish screenshots to the ci-screenshots branch
    steps:
      - uses: actions/checkout@v6

      - name: Show toolchain
        run: |
          xcodebuild -version
          sw_vers

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache Swift packages
        uses: actions/cache@v5
        with:
          path: build/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('project.yml') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          if [ -z "$UDID" ] || [ "$UDID" = "null" ]; then
            echo "No iPhone simulator found"; xcrun simctl list devices available; exit 1
          fi
          xcrun simctl list devices available | grep "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build and run unit tests
        run: |
          mkdir -p build
          status=0
          xcodebuild test \
            -project VehicleMaintenance.xcodeproj \
            -scheme VehicleMaintenance \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/TestResults.xcresult \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > build/xcodebuild.log 2>&1 || status=$?
          # Print only the useful lines; the full log is uploaded as an artifact.
          grep -E "error:|warning: .*\.swift|Test .*(passed|failed)|✔|✘|\*\* (BUILD|TEST)" build/xcodebuild.log | grep -v "SourcePackages" | sort -u | head -300 || true
          if [ "$status" -ne 0 ]; then
            echo "::error::xcodebuild failed with exit code $status"
            tail -80 build/xcodebuild.log
          fi
          exit $status

      - name: Build Release for device (unsigned)
        run: |
          status=0
          xcodebuild build \
            -project VehicleMaintenance.xcodeproj \
            -scheme VehicleMaintenance \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedDataRelease \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            > build/release.log 2>&1 || status=$?
          grep -E "error:|warning: .*\.swift|\*\* BUILD" build/release.log | grep -v "SourcePackages" | sort -u | head -100 || true
          if [ "$status" -ne 0 ]; then
            echo "::error::Release build failed with exit code $status"
            tail -80 build/release.log
          fi
          exit $status

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Start Firebase emulators and seed demo data
        working-directory: firebase
        run: |
          npm ci
          nohup npx firebase emulators:start --only auth,firestore,storage --project demo-maintenance > ../build/emulators.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -s http://127.0.0.1:8080 > /dev/null && curl -s http://127.0.0.1:9099 > /dev/null && curl -s http://127.0.0.1:9199 > /dev/null; then
              echo "Emulators ready"; break
            fi
            sleep 2
          done
          node scripts/seed-demo.mjs

      - name: Capture simulator screenshots
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build/DerivedData/Build/Products/Debug-iphonesimulator/VehicleMaintenance.app"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" "$APP"
          mkdir -p screenshots

          shoot() { # name appearance [launch args...]
            local name="$1" appearance="$2"; shift 2
            xcrun simctl ui "$UDID" appearance "$appearance"
            xcrun simctl terminate "$UDID" "$BUNDLE_ID" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE_ID" -useEmulator YES -demoSeed YES "$@"
            sleep "${WAIT:-7}"
            xcrun simctl io "$UDID" screenshot "screenshots/${name}.png"
          }

          WAIT=15 shoot 01-fleet light -initialTab fleet
          shoot 02-vehicle-unsafe light -initialTab fleet -demoScreen vehicle
          shoot 03-specs light -initialTab fleet -demoScreen specs
          shoot 04-checklist light -initialTab fleet -demoScreen checklist
          shoot 05-defects light -initialTab defects
          shoot 06-upcoming light -initialTab upcoming
          shoot 07-settings light -initialTab settings
          shoot 08-data-storage light -initialTab settings -demoScreen storage
          shoot 09-members light -initialTab settings -demoScreen members
          shoot 10-checklists light -initialTab settings -demoScreen checklists
          shoot 11-fleet-dark dark -initialTab fleet
          shoot 12-vehicle-dark dark -initialTab fleet -demoScreen vehicle

      - name: Publish screenshots to the ci-screenshots branch
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHOTS=$(mktemp -d)
          cp screenshots/*.png "$SHOTS"/
          cd "$SHOTS"
          {
            echo "# Simulator screenshots"
            echo
            echo "Built from ${GITHUB_SHA} (run ${GITHUB_RUN_ID}), using demo data in the Firebase emulators."
            echo
            for f in *.png; do echo "### ${f%.png}"; echo; echo "<img src=\"$f\" width=\"300\">"; echo; done
          } > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-results
          if-no-files-found: ignore
          path: |
            build/xcodebuild.log
            build/release.log
            build/emulators.log
            build/TestResults.xcresult
            screenshots/
