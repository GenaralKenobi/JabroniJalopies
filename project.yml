name: VehicleMaintenance
options:
  bundleIdPrefix: com.generalkenobi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "13.1.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VehicleMaintenance:
    type: application
    platform: iOS
    sources:
      - path: VehicleMaintenance
        excludes:
          - "Info.plist"
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
    info:
      path: VehicleMaintenance/Info.plist
      properties:
        NSAccentColorName: AccentColor
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.generalkenobi.jabronijalopies.photo-upload]
        NSCameraUsageDescription: Take photos of vehicle problems so your fleet manager can see them.
        NSPhotoLibraryUsageDescription: Attach existing photos to vehicle problems and vehicle profiles.
        NSCalendarsWriteOnlyAccessUsageDescription: Add the days you plan for scheduled truck checklists to your calendar.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.generalkenobi.jabronijalopies
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Jalopies
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # The app uses no custom encryption; skips the export-compliance question in App Store Connect.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  VehicleMaintenanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VehicleMaintenanceTests]
    dependencies:
      - target: VehicleMaintenance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VehicleMaintenance:
    build:
      targets:
        VehicleMaintenance: all
        VehicleMaintenanceTests: [test]
    test:
      targets: [VehicleMaintenanceTests]
