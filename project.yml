name: VehicleMaintenance
options:
  bundleIdPrefix: com.genaralkenobi
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  VehicleMaintenance:
    type: application
    platform: iOS
    sources: [VehicleMaintenance]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.genaralkenobi.maintenance
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Maintenance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # The app uses no custom encryption; skips the export-compliance question in App Store Connect.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  VehicleMaintenanceTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VehicleMaintenanceTests]
    dependencies:
      - target: VehicleMaintenance
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  VehicleMaintenance:
    build:
      targets:
        VehicleMaintenance: all
        VehicleMaintenanceTests: [test]
    test:
      targets: [VehicleMaintenanceTests]
